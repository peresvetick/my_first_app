name: my_first_app
description: A new Flutter project.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.0.4
  path_provider: ^2.1.1
  flutter_map: ^6.1.0  
  latlong2: ^0.9.0    
  http: ^1.1.0
  flutter_polyline_points: ^3.1.0
  geolocator: ^14.1.1
  flutter_map_marker_cluster: ^1.3.6
  video_player: ^2.14.1
  flutter_animate: ^4.5.2
  easy_localization: ^3.0.8
  youtube_player_flutter: ^10.0.1
  record: ^6.0.0
  audioplayers: ^6.4.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/maps/
    - assets/translations/